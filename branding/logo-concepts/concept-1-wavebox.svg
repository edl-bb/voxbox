<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept 1 — "Wavebox": classic macOS rounded-square, live waveform glyph.
       Layered for Icon Composer: background layer + glyph layer. -->
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D5DF6"/>
      <stop offset="1" stop-color="#4636C9"/>
    </linearGradient>
  </defs>
  <!-- Background layer -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg1)"/>
  <!-- Glyph layer: waveform -->
  <g fill="#FFFFFF">
    <rect x="126" y="216" width="28" height="80" rx="14"/>
    <rect x="182" y="176" width="28" height="160" rx="14"/>
    <rect x="238" y="128" width="28" height="256" rx="14"/>
    <rect x="294" y="176" width="28" height="160" rx="14"/>
    <rect x="350" y="216" width="28" height="80" rx="14"/>
  </g>
</svg>
