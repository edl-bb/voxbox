<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept 2 — "Voice bubble": speech bubble carrying a waveform —
       says "spoken words become text" at a glance. -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0FB5A6"/>
      <stop offset="1" stop-color="#0A7E8C"/>
    </linearGradient>
  </defs>
  <!-- Background layer -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg2)"/>
  <!-- Glyph layer: rounded speech bubble with tail -->
  <g fill="#FFFFFF">
    <path d="M136 132h240a44 44 0 0 1 44 44v128a44 44 0 0 1-44 44H236l-62 58c-8 7.5-22 2-22-9v-49h-16a44 44 0 0 1-44-44V176a44 44 0 0 1 44-44z"/>
  </g>
  <!-- Waveform knocked out of the bubble -->
  <g fill="#0A7E8C">
    <rect x="164" y="216" width="20" height="48" rx="10"/>
    <rect x="208" y="192" width="20" height="96" rx="10"/>
    <rect x="252" y="172" width="20" height="136" rx="10"/>
    <rect x="296" y="192" width="20" height="96" rx="10"/>
    <rect x="340" y="216" width="20" height="48" rx="10"/>
  </g>
</svg>
