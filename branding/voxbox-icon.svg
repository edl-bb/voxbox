<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- VoxBox app icon master — Concept 3 "V-wave monogram" (chosen).
       Sized to Apple's macOS icon grid: 824px squircle on a 1024 canvas.
       Layers for Icon Composer: background (tile) + glyph (V-wave bars). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1C24"/>
      <stop offset="1" stop-color="#0B0B10"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#37E2D5"/>
    </linearGradient>
  </defs>

  <!-- Background layer -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- subtle top sheen for edge definition on dark backgrounds -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>

  <!-- Glyph layer: V built from waveform bars, descending then ascending -->
  <g fill="url(#v)">
    <rect x="258" y="300" width="60" height="180" rx="30"/>
    <rect x="370" y="300" width="60" height="300" rx="30"/>
    <rect x="482" y="300" width="60" height="424" rx="30"/>
    <rect x="594" y="300" width="60" height="300" rx="30"/>
    <rect x="706" y="300" width="60" height="180" rx="30"/>
  </g>
</svg>
