<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Alt 16 "Tapered Extreme" — 08 pushed further: outer bars go needle
       thin (32px) while the centre swells to 92px, making the V read almost
       like a single bold stroke with whiskers. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14141B"/>
      <stop offset="1" stop-color="#08080C"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4FDB"/>
      <stop offset="1" stop-color="#5FBBFF"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>
  <g fill="url(#v)">
    <rect x="272" y="300" width="32" height="170" rx="16"/>
    <rect x="376" y="300" width="48" height="296" rx="24"/>
    <rect x="466" y="300" width="92" height="424" rx="46"/>
    <rect x="600" y="300" width="48" height="296" rx="24"/>
    <rect x="720" y="300" width="32" height="170" rx="16"/>
  </g>
</svg>
