<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Alt 09 "Waveline" — one continuous rounded stroke traces the V
       through the bar tips, flanked by two short bars for the soundwave
       rhythm. A more literal "V" while keeping the wave DNA. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14141B"/>
      <stop offset="1" stop-color="#08080C"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#5FBBFF"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>
  <!-- continuous V stroke through the original bar-tip positions -->
  <path d="M 336 366 L 512 668 L 688 366" fill="none" stroke="url(#v)"
        stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- flanking soundwave bars at the original outer positions -->
  <g fill="#2E6BFF">
    <rect x="216" y="330" width="60" height="150" rx="30"/>
    <rect x="748" y="330" width="60" height="150" rx="30"/>
  </g>
</svg>
