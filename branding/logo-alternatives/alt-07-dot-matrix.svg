<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Alt 07 "Dot Matrix" — each bar becomes a column of dots, keeping the
       exact V silhouette but reading as sampled audio / LED meter. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14141B"/>
      <stop offset="1" stop-color="#08080C"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6BFF"/>
      <stop offset="1" stop-color="#5FBBFF"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>
  <g fill="url(#v)">
    <!-- col 1: 2 dots -->
    <circle cx="288" cy="330" r="30"/>
    <circle cx="288" cy="450" r="30"/>
    <!-- col 2: 3 dots -->
    <circle cx="400" cy="330" r="30"/>
    <circle cx="400" cy="450" r="30"/>
    <circle cx="400" cy="570" r="30"/>
    <!-- col 3: 4 dots -->
    <circle cx="512" cy="330" r="30"/>
    <circle cx="512" cy="450" r="30"/>
    <circle cx="512" cy="570" r="30"/>
    <circle cx="512" cy="690" r="30"/>
    <!-- col 4: 3 dots -->
    <circle cx="624" cy="330" r="30"/>
    <circle cx="624" cy="450" r="30"/>
    <circle cx="624" cy="570" r="30"/>
    <!-- col 5: 2 dots -->
    <circle cx="736" cy="330" r="30"/>
    <circle cx="736" cy="450" r="30"/>
  </g>
</svg>
