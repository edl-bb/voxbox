<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Alt 37 — refinement of 29: bars widened 60→68px (same centres) for a
       touch more presence, everything else untouched. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111119"/>
      <stop offset="1" stop-color="#06060A"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B3B9E"/>
      <stop offset="1" stop-color="#7DB9FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>
  <g fill="#2E6BFF" filter="url(#glow)" opacity="0.35">
    <rect x="254" y="300" width="68" height="180" rx="34"/>
    <rect x="366" y="300" width="68" height="300" rx="34"/>
    <rect x="478" y="300" width="68" height="424" rx="34"/>
    <rect x="590" y="300" width="68" height="300" rx="34"/>
    <rect x="702" y="300" width="68" height="180" rx="34"/>
  </g>
  <g fill="url(#v)">
    <rect x="254" y="300" width="68" height="180" rx="34"/>
    <rect x="366" y="300" width="68" height="300" rx="34"/>
    <rect x="478" y="300" width="68" height="424" rx="34"/>
    <rect x="590" y="300" width="68" height="300" rx="34"/>
    <rect x="702" y="300" width="68" height="180" rx="34"/>
  </g>
</svg>
