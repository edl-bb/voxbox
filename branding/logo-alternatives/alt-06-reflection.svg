<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Alt 06 "Reflection" — the V-wave sits higher with a faded mirror
       image below the tips, like a waveform over dark glass. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14141B"/>
      <stop offset="1" stop-color="#08080C"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6BFF"/>
      <stop offset="1" stop-color="#5FBBFF"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="reflmask">
      <rect x="0" y="0" width="1024" height="1024" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>
  <!-- main V, scaled 0.86 and raised to leave room for the reflection -->
  <g fill="url(#v)" transform="translate(72,-38) scale(0.86)">
    <rect x="258" y="300" width="60" height="180" rx="30"/>
    <rect x="370" y="300" width="60" height="300" rx="30"/>
    <rect x="482" y="300" width="60" height="424" rx="30"/>
    <rect x="594" y="300" width="60" height="300" rx="30"/>
    <rect x="706" y="300" width="60" height="180" rx="30"/>
  </g>
  <!-- mirrored reflection, fading downward -->
  <g mask="url(#reflmask)">
    <g fill="url(#v)" transform="translate(72,1272) scale(0.86,-0.86)">
      <rect x="258" y="300" width="60" height="180" rx="30"/>
      <rect x="370" y="300" width="60" height="300" rx="30"/>
      <rect x="482" y="300" width="60" height="424" rx="30"/>
      <rect x="594" y="300" width="60" height="300" rx="30"/>
      <rect x="706" y="300" width="60" height="180" rx="30"/>
    </g>
  </g>
</svg>
