<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Alt 40 "Candidate" — my recommended blend of the two directions:
       32's late-arriving global light (dark mass up top, apex punch) with
       36's tip-weighted bloom, so the glow only lives where the light is. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111119"/>
      <stop offset="1" stop-color="#06060A"/>
    </linearGradient>
    <linearGradient id="v" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="724">
      <stop offset="0" stop-color="#14285F"/>
      <stop offset="0.7" stop-color="#2E6BFF"/>
      <stop offset="1" stop-color="#98D3FF"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>
  <!-- bloom only from the lower stretch of each bar -->
  <g fill="#5FA8FF" filter="url(#glow)" opacity="0.4">
    <rect x="258" y="390" width="60" height="90" rx="30"/>
    <rect x="370" y="450" width="60" height="150" rx="30"/>
    <rect x="482" y="512" width="60" height="212" rx="30"/>
    <rect x="594" y="450" width="60" height="150" rx="30"/>
    <rect x="706" y="390" width="60" height="90" rx="30"/>
  </g>
  <g fill="url(#v)">
    <rect x="258" y="300" width="60" height="180" rx="30"/>
    <rect x="370" y="300" width="60" height="300" rx="30"/>
    <rect x="482" y="300" width="60" height="424" rx="30"/>
    <rect x="594" y="300" width="60" height="300" rx="30"/>
    <rect x="706" y="300" width="60" height="180" rx="30"/>
  </g>
</svg>
