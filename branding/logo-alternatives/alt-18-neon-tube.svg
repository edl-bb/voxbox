<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Alt 18 "Neon Tube" — iteration on 10: the bars as glowing outlines,
       like bent neon glass tubing on a black wall. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E0E15"/>
      <stop offset="1" stop-color="#05050A"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="4"/>
  <!-- glow pass -->
  <g fill="none" stroke="#3B82F6" stroke-width="20" filter="url(#glow)" opacity="0.9">
    <rect x="265" y="307" width="46" height="166" rx="23"/>
    <rect x="377" y="307" width="46" height="286" rx="23"/>
    <rect x="489" y="307" width="46" height="410" rx="23"/>
    <rect x="601" y="307" width="46" height="286" rx="23"/>
    <rect x="713" y="307" width="46" height="166" rx="23"/>
  </g>
  <!-- bright tube pass -->
  <g fill="none" stroke="#9CCBFF" stroke-width="12">
    <rect x="265" y="307" width="46" height="166" rx="23"/>
    <rect x="377" y="307" width="46" height="286" rx="23"/>
    <rect x="489" y="307" width="46" height="410" rx="23"/>
    <rect x="601" y="307" width="46" height="286" rx="23"/>
    <rect x="713" y="307" width="46" height="166" rx="23"/>
  </g>
</svg>
