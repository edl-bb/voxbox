name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      # Release/working branches (v1.1.3, v1.2, …) get CI directly, so builds
      # are verified before a PR is opened.
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      # mlx-swift compiles .metal kernel sources; on Xcode 26 images the
      # Metal toolchain is a separately downloaded component.
      - name: Ensure Metal toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain \
            || echo "Metal toolchain download skipped (may already be installed)"

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      # Cache resolved Swift packages so WhisperKit / FluidAudio / swift-transformers
      # aren't re-fetched and recompiled every run. Keyed on the resolved graph.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: SourcePackages
          # Also hash the pbxproj so the key still tracks the dependency
          # graph while Package.resolved is absent from the repo.
          key: ${{ runner.os }}-spm-${{ hashFiles('VoxBox.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'VoxBox.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Compile once with build-for-testing, then run the tests without rebuilding,
      # instead of a full `build` followed by a `test` that recompiles the app.
      # On failure, compiler errors are re-emitted as ::error:: workflow
      # commands so they surface as check-run annotations (readable via the
      # API even when the raw log download is unavailable).
      - name: Build for testing
        run: |
          set -o pipefail
          # -enableCodeCoverage NO: the autocreated test plan instruments
          # builds with the profile runtime, and C package products (yyjson,
          # via swift-transformers) fail to link it into their dylibs
          # (undefined ___llvm_profile_runtime — swiftlang/swift#57137).
          # MACOSX_DEPLOYMENT_TARGET pins SPM packages that declare no
          # platforms (yyjson defaults to macOS 10.13) to the app's target.
          if ! xcodebuild build-for-testing \
            -scheme voxbox \
            -configuration Debug \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath SourcePackages \
            -enableCodeCoverage NO \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-build.log; then
            {
              # Undefined-symbol detail first: annotations cap at 10 per step.
              grep -A8 "Undefined symbols" xcodebuild-build.log | head -10
              grep -E "(: error:|error: |fatal error: |ld: |duplicate symbol|no such module|cannot find )" xcodebuild-build.log | sort -u | head -20
            } | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-build-log
          path: xcodebuild-build.log
          if-no-files-found: ignore

      - name: Unit tests
        run: |
          set -o pipefail
          if ! xcodebuild test-without-building \
            -scheme voxbox \
            -destination 'platform=macOS' \
            -only-testing:voxboxTests \
            -clonedSourcePackagesDirPath SourcePackages \
            -enableCodeCoverage NO \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-test.log; then
            grep -E "(error: |Test Case .* failed|failed \()" xcodebuild-test.log \
              | sort -u | head -40 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # SwiftLint is sometimes preinstalled on the macOS runner image; fall
      # back to brew, and tolerate brew failures (the macos-26 image has hit
      # untrusted-tap errors) — lint is advisory, it must never block CI.
      - name: Ensure SwiftLint
        continue-on-error: true
        run: command -v swiftlint >/dev/null || brew install swiftlint

      # Advisory only: the codebase has a large pre-existing violation
      # backlog, so the step is allowed to fail without failing the job.
      # Remove continue-on-error once the backlog is cleared to make it a gate.
      - name: Run SwiftLint
        continue-on-error: true
        run: |
          if command -v swiftlint >/dev/null; then
            swiftlint
          else
            echo "SwiftLint unavailable on this runner — skipping (advisory)."
          fi
